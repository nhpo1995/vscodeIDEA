name: CI - Test and package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package -- --out ci.vsix

      - name: Save the validation VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ci-vsix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci.vsix
          if-no-files-found: error
